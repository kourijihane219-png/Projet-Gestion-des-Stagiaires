
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ajouter un stagiaire</title>
    <style>
        body { font-family: Arial; background: #f0f2f5; padding: 25px; }
        nav { background: #2563eb; padding: 15px; }
        nav a { color: white; margin-right: 20px; text-decoration: none; }
        .container {
            background: white; max-width: 500px;
            margin: 30px auto; padding: 25px; border-radius: 10px;
        }
        input, button {
            width: 100%; padding: 10px; margin: 8px 0;
            box-sizing: border-box;
        }
        button { background: #2563eb; color: white; border: 0; cursor: pointer; }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem("connecte") !== "oui") {
        window.location.href = "connexion.html";
    }
</script>

<nav>
    <a href="ajout.html">Ajouter</a>
    <a href="liste.html">Liste des stagiaires</a>
    <a href="emploi.html">Emploi du temps</a>
    <a href="#" onclick="deconnexion()">Déconnexion</a>
</nav>

<div class="container">
    <h2>Ajouter un stagiaire</h2>

    <form id="formAjout">
        <input type="text" id="code" placeholder="Code" required>
        <input type="text" id="nom" placeholder="Nom" required>
        <input type="text" id="prenom" placeholder="Prénom" required>
        <input type="email" id="email" placeholder="Email" required>

        <button type="submit">Ajouter</button>
    </form>

    <p id="message"></p>
</div>

<script>
    function deconnexion() {
        localStorage.removeItem("connecte");
        window.location.href = "connexion.html";
    }

    let form = document.getElementById("formAjout");

    form.addEventListener("submit", function(e) {
        e.preventDefault();

        let stagiaires = JSON.parse(
            localStorage.getItem("stagiaires") || "[]"
        );

        let code = document.getElementById("code").value;
        let nom = document.getElementById("nom").value;
        let prenom = document.getElementById("prenom").value;
        let email = document.getElementById("email").value;

        let existe = stagiaires.some(s => s.code === code);

        if (existe) {
            document.getElementById("message").textContent =
                "Ce code existe déjà !";
            return;
        }

        let stagiaire = {
            code: code,
            nom: nom,
            prenom: prenom,
            email: email
        };

        stagiaires.push(stagiaire);

        localStorage.setItem(
            "stagiaires",
            JSON.stringify(stagiaires)
        );

        document.getElementById("message").textContent =
            "Stagiaire ajouté avec succès !";

        form.reset();
    });
</script>

</body>
</html>
