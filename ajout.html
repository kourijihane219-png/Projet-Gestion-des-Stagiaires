<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ajouter un stagiaire</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        #message {
            text-align: center;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Ajouter un stagiaire</h2>
         <p>Bonjour</p>
        <form id="formStagiaire">

            <label>Code :</label>
            <input type="text" id="code" required>

            <label>Nom :</label>
            <input type="text" id="nom" required>

            <label>Prénom :</label>
            <input type="text" id="prenom" required>

            <label>Email :</label>
            <input type="email" id="email" required>

            <button type="submit">Ajouter</button>

            <p id="message"></p>

        </form>

    </div>

    <h2>Liste des stagiaires</h2>

    <table>
        <thead>
            <tr>
                <th>Code</th>
                <th>Nom</th>
                <th>Prénom</th>
                <th>Email</th>
            </tr>
        </thead>

        <tbody id="listeStagiaires">
        </tbody>
    </table>

    <script>

        let stagiaires = [];

        let form = document.getElementById("formStagiaire");

        form.addEventListener("submit", function(e) {

            e.preventDefault();

            let code = document.getElementById("code").value;
            let nom = document.getElementById("nom").value;
            let prenom = document.getElementById("prenom").value;
            let email = document.getElementById("email").value;

            let message = document.getElementById("message");

            // Vérifier si le code existe déjà
            let existe = stagiaires.some(s => s.code === code);

            if (existe) {
                message.textContent = "Ce code existe déjà !";
                message.style.color = "red";
                return;
            }

            // Créer un nouveau stagiaire
            let stagiaire = {
                code: code,
                nom: nom,
                prenom: prenom,
                email: email
            };

            // Ajouter au tableau
            stagiaires.push(stagiaire);

            // Afficher la liste
            afficherStagiaires();

            message.textContent = "Stagiaire ajouté avec succès !";
            message.style.color = "green";

            // Vider le formulaire
            form.reset();

        });

        function afficherStagiaires() {

            let liste = document.getElementById("listeStagiaires");

            liste.innerHTML = "";

            stagiaires.forEach(function(s) {

                let ligne = `
                    <tr>
                        <td>${s.code}</td>
                        <td>${s.nom}</td>
                        <td>${s.prenom}</td>
                        <td>${s.email}</td>
                    </tr>
                `;

                liste.innerHTML += ligne;

            });

        }

    </script>

</body>
</html>
