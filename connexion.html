
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Connexion</title>
    <style>
        body {
            font-family: Arial;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: white;
            padding: 30px;
            width: 300px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 15px;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }
        button {
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="container">

        <h2>Connexion</h2>

        <form id="formConnexion">

            <label>Email :</label>
            <input type="email" id="email" required>

        <input type="password" id="password"
               placeholder="Mot de passe" required>

        <button type="submit">Se connecter</button>
    </form>

    <p id="message"></p>
</div>

<script>
    document.getElementById("formConnexion")
    .addEventListener("submit", function(e) {

        e.preventDefault();

        let email = document.getElementById("email").value;
        let password = document.getElementById("password").value;

        if (email === "admin@gmail.com" && password === "1234") {

            localStorage.setItem("connecte", "oui");

            window.location.href = "ajout.html";

        } else {
            document.getElementById("message").textContent =
                "Email ou mot de passe incorrect !";
        }
    });
</script>

</body>
</html>
