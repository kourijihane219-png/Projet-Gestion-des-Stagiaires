
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des stagiaires</title>
    <style>
        body {
            font-family: Arial;
            background: #f1f5f9;
            margin: 0;
            padding: 20px;
        }

        nav {
            background: #2563eb;
            padding: 18px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 25px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }

        th {
            background: #2563eb;
            color: white;
        }

        button {
            background: #dc2626;
            color: white;
            padding: 8px 12px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<script>
    if (localStorage.getItem("connecte") !== "oui") {
        window.location.href = "connexion.html";
    }
</script>

<nav>
    <a href="ajout.html">Ajouter</a>
    <a href="supprimer.html">Supprimer / Liste</a>
    <a href="emploi.html">Emploi du temps</a>
    <a href="#" onclick="deconnexion()">Déconnexion</a>
</nav>

<h2>Liste des stagiaires</h2>

<table>
    <thead>
        <tr>
            <th>Code</th>
            <th>Nom</th>
            <th>Prénom</th>
            <th>Email</th>
            <th>Action</th>
        </tr>
    </thead>

    <tbody id="tableau"></tbody>
</table>

<script>
    function deconnexion() {
        localStorage.removeItem("connecte");
        window.location.href = "connexion.html";
    }

    function afficherStagiaires() {

        let stagiaires = JSON.parse(
            localStorage.getItem("stagiaires") || "[]"
        );

        let tableau = document.getElementById("tableau");

        tableau.innerHTML = "";

        stagiaires.forEach(function(s, i) {

            tableau.innerHTML += `
                <tr>
                    <td>${s.code}</td>
                    <td>${s.nom}</td>
                    <td>${s.prenom}</td>
                    <td>${s.email}</td>
                    <td>
                        <button onclick="supprimer(${i})">
                            Supprimer
                        </button>
                    </td>
                </tr>
            `;
        });

        if (stagiaires.length === 0) {
            tableau.innerHTML =
                "<tr><td colspan='5'>Aucun stagiaire enregistré</td></tr>";
        }
    }

    function supprimer(index) {

        let stagiaires = JSON.parse(
            localStorage.getItem("stagiaires") || "[]"
        );

        if (confirm("Voulez-vous supprimer ce stagiaire ?")) {

            stagiaires.splice(index, 1);

            localStorage.setItem(
                "stagiaires",
                JSON.stringify(stagiaires)
            );

            afficherStagiaires();
        }
    }

    afficherStagiaires();
</script>

</body>
</html>
