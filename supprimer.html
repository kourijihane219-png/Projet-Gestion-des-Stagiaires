
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Supprimer un stagiaire</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
            padding: 30px;
        }

        .container {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px #ccc;
        }

        h2 {
            text-align: center;
            color: #2563eb;
        }

        label {
            display: block;
            margin-top: 12px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .supprimer {
            background-color: #dc2626;
        }

        .supprimer:hover {
            background-color: #b91c1c;
        }

        #message {
            text-align: center;
            font-weight: bold;
            margin-top: 15px;
        }

        table {
            width: 100%;
            margin-top: 25px;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }

        th {
            background-color: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Supprimer un stagiaire</h2>

        <form id="formSuppression">

            <label>Code du stagiaire :</label>

            <input type="text" id="code" required>

            <button type="submit">Rechercher</button>

            <p id="message"></p>

        </form>

        <div id="resultat"></div>

    </div>

    <script>

        // Récupérer les stagiaires enregistrés
        let stagiaires = JSON.parse(
            localStorage.getItem("stagiaires")
        ) || [];

        let form = document.getElementById("formSuppression");

        form.addEventListener("submit", function(e) {

            e.preventDefault();

            let code = document.getElementById("code").value;

            let message = document.getElementById("message");

            let stagiaire = stagiaires.find(function(s) {
                return s.code === code;
            });

            let resultat = document.getElementById("resultat");

            if (!stagiaire) {

                message.textContent = "Stagiaire introuvable !";
                message.style.color = "red";

                resultat.innerHTML = "";

                return;
            }

            message.textContent = "Stagiaire trouvé !";
            message.style.color = "green";

            resultat.innerHTML = `
                <table>
                    <tr>
                        <th>Code</th>
                        <th>Nom</th>
                        <th>Prénom</th>
                        <th>Email</th>
                    </tr>

                    <tr>
                        <td>${stagiaire.code}</td>
                        <td>${stagiaire.nom}</td>
                        <td>${stagiaire.prenom}</td>
                        <td>${stagiaire.email}</td>
                    </tr>
                </table>

                <button class="supprimer"
                    onclick="supprimerStagiaire('${stagiaire.code}')">
                    Confirmer la suppression
                </button>
            `;

        });

        function supprimerStagiaire(code) {

            let confirmation = confirm(
                "Voulez-vous vraiment supprimer ce stagiaire ?"
            );

            if (confirmation) {

                stagiaires = stagiaires.filter(function(s) {
                    return s.code !== code;
                });

                localStorage.setItem(
                    "stagiaires",
                    JSON.stringify(stagiaires)
                );

                document.getElementById("message").textContent =
                    "Stagiaire supprimé avec succès !";

                document.getElementById("message").style.color = "green";

                document.getElementById("resultat").innerHTML = "";

                document.getElementById("formSuppression").reset();

            }

        }

    </script>

</body>
</html>
